name: Deploy Poporo Open Design Presentation to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate HTML and Spec Files
        run: |
          echo "Verificando estructura de archivos de la presentación Poporo Open Design..."
          test -f index.html || (echo "Falta index.html" && exit 1)
          test -f css/styles.css || (echo "Falta css/styles.css" && exit 1)
          test -f js/main.js || (echo "Falta js/main.js" && exit 1)
          test -f data/open-design-spec.json || (echo "Falta data/open-design-spec.json" && exit 1)
          test -f docs/OPEN_DESIGN_SPEC.md || (echo "Falta docs/OPEN_DESIGN_SPEC.md" && exit 1)
          echo "Todos los archivos críticos verificados exitosamente."

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: lint-and-validate
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
